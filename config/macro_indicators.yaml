countries:
  - id: us
    label: "미국"
    priority: 1
    purpose: "글로벌 금리·달러·성장주·AI반도체 투자심리 판단"
    categories:
      - id: inflation
        label: "물가"
        indicators:
          - id: cpi
            label: "CPI (소비자물가지수)"
            full_name: "Consumer Price Index"
            unit: "%YoY"
            release_cycle: "월간"
            description: "소비자가 구매하는 재화·서비스의 가격 변동을 측정하는 지표. 인플레이션 압력을 나타내는 대표 지수."
            higher_than_expected: "물가 부담 강화 → 금리 인하 기대 약화 → 미국 국채금리 상승 → 성장주·기술주 밸류에이션 부담"
            lower_than_expected: "물가 압력 완화 → 금리 인하 기대 강화 → 위험자산 선호 증가 → 성장주 긍정"
            related_sectors: ["성장주", "국채", "달러", "AI반도체", "SOXL"]

          - id: core_cpi
            label: "Core CPI (근원 소비자물가)"
            full_name: "Core Consumer Price Index"
            unit: "%YoY"
            release_cycle: "월간"
            description: "식품·에너지를 제외한 소비자물가. 기저 인플레이션 압력을 더 정확히 보여줌."
            higher_than_expected: "근원 물가 고착화 우려 → 연준 매파적 전환 → 금리 인하 후퇴 → 성장주 부담"
            lower_than_expected: "인플레이션 둔화 확인 → 연준 완화 기대 → 채권 강세·성장주 반등"
            related_sectors: ["성장주", "국채", "달러"]

          - id: ppi
            label: "PPI (생산자물가지수)"
            full_name: "Producer Price Index"
            unit: "%YoY"
            release_cycle: "월간"
            description: "생산자 단계의 가격 변동. CPI의 선행 지표로 향후 소비자물가 방향을 예측하는 데 활용."
            higher_than_expected: "향후 CPI 상승 압력 예고 → 금리 인하 지연 우려"
            lower_than_expected: "향후 CPI 완화 신호 → 금리 인하 기대 강화"
            related_sectors: ["원자재", "에너지", "국채"]

          - id: pce
            label: "PCE (개인소비지출 물가)"
            full_name: "Personal Consumption Expenditures"
            unit: "%YoY"
            release_cycle: "월간"
            description: "연준이 가장 중시하는 물가 지표. CPI보다 소비 패턴 변화를 더 잘 반영."
            higher_than_expected: "연준 목표(2%) 초과 → 금리 인하 신중론 강화"
            lower_than_expected: "연준 목표 근접 → 금리 인하 경로 확인"
            related_sectors: ["성장주", "국채", "달러"]

          - id: core_pce
            label: "Core PCE (근원 개인소비지출)"
            full_name: "Core Personal Consumption Expenditures"
            unit: "%YoY"
            release_cycle: "월간"
            description: "식품·에너지 제외 PCE. 연준의 핵심 물가 판단 지표."
            higher_than_expected: "연준 긴축 장기화 우려 → 금리 상승 → 성장주 부담"
            lower_than_expected: "연준 정책 전환 기대 강화"
            related_sectors: ["성장주", "국채"]

      - id: rates
        label: "금리"
        indicators:
          - id: fed_rate
            label: "미국 기준금리 (Fed Funds Rate)"
            full_name: "Federal Funds Rate"
            unit: "%"
            release_cycle: "FOMC 회의(연 8회)"
            description: "미국 연방준비제도(Fed)의 기준금리. 글로벌 금융시장 전체의 기준점."
            higher_than_expected: "긴축 강화 → 달러 강세 → 위험자산 회피 → 성장주·한국증시 부담"
            lower_than_expected: "완화 신호 → 달러 약세 → 위험자산 선호 → 성장주·한국증시 긍정"
            related_sectors: ["성장주", "달러", "한국증시", "레버리지ETF"]

          - id: us_2y
            label: "미국 2년물 국채금리"
            full_name: "US 2-Year Treasury Yield"
            unit: "%"
            release_cycle: "실시간"
            description: "연준 정책 기대를 가장 민감하게 반영. 금리 인하/인상 기대의 선행 지표."
            higher_than_expected: "시장의 긴축 기대 상승 → 성장주 밸류에이션 부담"
            lower_than_expected: "금리 인하 기대 → 성장주 지지"
            related_sectors: ["성장주", "달러", "국채"]

          - id: us_10y
            label: "미국 10년물 국채금리"
            full_name: "US 10-Year Treasury Yield"
            unit: "%"
            release_cycle: "실시간"
            description: "장기 경제 성장 기대와 인플레이션 프리미엄을 반영. 성장주 밸류에이션의 핵심 할인율."
            higher_than_expected: "할인율 상승 → 성장주 PER 부담 → AI·반도체 단기 조정 가능"
            lower_than_expected: "성장주 밸류에이션 개선 → AI·반도체·클라우드 긍정"
            related_sectors: ["성장주", "AI반도체", "클라우드", "SOXL"]

      - id: employment
        label: "고용"
        indicators:
          - id: nonfarm_payrolls
            label: "비농업고용 (NFP)"
            full_name: "Non-Farm Payrolls"
            unit: "천명"
            release_cycle: "월간(매월 첫째 금요일)"
            description: "미국 농업 제외 취업자 수 변화. 경기 강도와 연준 정책 방향의 핵심 지표."
            higher_than_expected: "경기 과열 우려 → 금리 인하 지연 → 성장주 단기 부담"
            lower_than_expected: "경기 둔화 신호 → 금리 인하 기대 → 채권 강세"
            related_sectors: ["달러", "국채", "성장주"]

          - id: unemployment
            label: "실업률"
            full_name: "Unemployment Rate"
            unit: "%"
            release_cycle: "월간"
            description: "경제활동인구 대비 실업자 비율. 고용시장 건강도 측정."
            higher_than_expected: "고용 악화 → 경기 둔화 우려 → 방어주 선호"
            lower_than_expected: "고용 호조 → 소비 지지 → 경기민감주 긍정"
            related_sectors: ["소비주", "달러"]

          - id: avg_hourly_earnings
            label: "평균 시간당 임금"
            full_name: "Average Hourly Earnings"
            unit: "%YoY"
            release_cycle: "월간"
            description: "임금 인플레이션 지표. 높은 임금 상승은 서비스 물가 고착의 원인."
            higher_than_expected: "임금 인플레이션 → 서비스 CPI 상승 → 금리 인하 지연"
            lower_than_expected: "임금 압력 완화 → 물가 안정 기대"
            related_sectors: ["국채", "성장주"]

          - id: jobless_claims
            label: "신규 실업수당 청구건수"
            full_name: "Initial Jobless Claims"
            unit: "천건"
            release_cycle: "주간(매주 목요일)"
            description: "주간 단위 고용 동향의 가장 빠른 지표. 고용시장 변화를 실시간으로 확인."
            higher_than_expected: "고용 악화 신호 → 경기 둔화 우려"
            lower_than_expected: "고용 견조 → 소비 지지"
            related_sectors: ["경기민감주"]

      - id: economy
        label: "경기"
        indicators:
          - id: gdp
            label: "GDP (국내총생산)"
            full_name: "Gross Domestic Product"
            unit: "%QoQ(연율)"
            release_cycle: "분기(속보→잠정→확정)"
            description: "미국 경제 전체의 성장률. 경기 확장/둔화/침체의 핵심 판단 기준."
            higher_than_expected: "경제 호조 → 위험자산 선호 → 주식 긍정"
            lower_than_expected: "경기 둔화 우려 → 방어주·채권 선호"
            related_sectors: ["전체시장", "경기민감주"]

          - id: ism_manufacturing
            label: "ISM 제조업 PMI"
            full_name: "ISM Manufacturing PMI"
            unit: "지수(50 기준)"
            release_cycle: "월간"
            description: "제조업 경기 선행 지표. 50 이상: 확장, 50 미만: 수축."
            higher_than_expected: "제조업 회복 → 산업재·소재주 긍정"
            lower_than_expected: "제조업 둔화 → 경기민감주 부담"
            related_sectors: ["산업재", "소재", "반도체장비"]

          - id: ism_services
            label: "ISM 서비스업 PMI"
            full_name: "ISM Services PMI"
            unit: "지수(50 기준)"
            release_cycle: "월간"
            description: "서비스업 경기 선행 지표. 미국 GDP의 약 70%를 차지."
            higher_than_expected: "서비스 경기 호조 → 소비주·금융주 긍정"
            lower_than_expected: "서비스 경기 둔화 우려"
            related_sectors: ["소비주", "금융주"]

          - id: retail_sales
            label: "소매판매"
            full_name: "Retail Sales"
            unit: "%MoM"
            release_cycle: "월간"
            description: "소비자 지출 동향. 미국 소비 경기의 직접 지표."
            higher_than_expected: "소비 호조 → 경제 성장 지속 기대"
            lower_than_expected: "소비 둔화 → 경기 냉각 우려"
            related_sectors: ["소비주", "유통"]

      - id: financial_market
        label: "금융시장"
        indicators:
          - id: dollar_index
            label: "달러인덱스 (DXY)"
            full_name: "US Dollar Index"
            unit: "지수"
            release_cycle: "실시간"
            description: "주요 6개 통화 대비 달러 강도. 글로벌 위험선호도의 역지표."
            higher_than_expected: "달러 강세 → 원화 약세 → 한국증시 외국인 수급 부담 → 신흥국 자금 유출"
            lower_than_expected: "달러 약세 → 신흥국·원자재 긍정 → 한국증시 수급 개선"
            related_sectors: ["한국증시", "원자재", "신흥국ETF"]

          - id: vix
            label: "VIX (공포지수)"
            full_name: "CBOE Volatility Index"
            unit: "지수"
            release_cycle: "실시간"
            description: "S&P500 옵션의 내재 변동성. 시장 불안 심리를 나타내는 '공포지수'."
            higher_than_expected: "시장 불안 고조 → Risk-Off → 레버리지ETF 비중 축소 필요"
            lower_than_expected: "시장 안정 → Risk-On → 위험자산 선호"
            related_sectors: ["SOXL", "레버리지ETF", "전체시장"]

  - id: korea
    label: "한국"
    priority: 2
    purpose: "국내 주식·원달러 환율·외국인 수급·반도체 수출 분석"
    categories:
      - id: inflation
        label: "물가"
        indicators:
          - id: kr_cpi
            label: "한국 CPI"
            full_name: "Korea Consumer Price Index"
            unit: "%YoY"
            release_cycle: "월간"
            description: "한국 소비자물가 변동. 한국은행 기준금리 결정의 핵심 지표."
            higher_than_expected: "한은 금리 인하 신중 → 국내 유동성 위축 → 코스피 부담"
            lower_than_expected: "한은 금리 인하 여력 확대 → 국내 시장 긍정"
            related_sectors: ["코스피", "한국 성장주"]

      - id: rates
        label: "금리"
        indicators:
          - id: bok_rate
            label: "한국은행 기준금리"
            full_name: "Bank of Korea Base Rate"
            unit: "%"
            release_cycle: "금통위(연 8회)"
            description: "한국 통화정책의 기준. 국내 대출금리·채권금리·주식 밸류에이션에 직접 영향."
            higher_than_expected: "긴축 강화 → 국내 유동성 감소 → 코스피 부담"
            lower_than_expected: "완화 신호 → 국내 유동성 증가 → 코스피 긍정"
            related_sectors: ["코스피", "코스닥", "부동산"]

      - id: fx
        label: "환율"
        indicators:
          - id: usdkrw
            label: "원/달러 환율"
            full_name: "USD/KRW Exchange Rate"
            unit: "원"
            release_cycle: "실시간"
            description: "외국인 투자자의 한국 시장 수익성과 직결. 환율 상승(원화 약세)은 외국인 수익 감소 의미."
            higher_than_expected: "원화 약세 → 외국인 수급 부담 → 코스피 하락 압력 / 수출주는 일부 긍정"
            lower_than_expected: "원화 강세 → 외국인 수급 개선 → 코스피 긍정"
            related_sectors: ["코스피", "삼성전자", "SK하이닉스", "수출주"]

      - id: exports
        label: "수출"
        indicators:
          - id: semiconductor_exports
            label: "반도체 수출"
            full_name: "Korea Semiconductor Exports"
            unit: "억달러"
            release_cycle: "월간"
            description: "한국 전체 수출의 약 20% 차지. SK하이닉스·삼성전자 실적 선행 지표."
            higher_than_expected: "반도체 업황 호조 → SK하이닉스·삼성전자 긍정"
            lower_than_expected: "반도체 업황 둔화 우려 → 반도체 대형주 부담"
            related_sectors: ["SK하이닉스", "삼성전자", "반도체장비"]

      - id: foreign_flow
        label: "수급"
        indicators:
          - id: foreign_net_buy
            label: "외국인 순매수"
            full_name: "Foreign Net Purchase (KOSPI)"
            unit: "억원"
            release_cycle: "일간"
            description: "외국인 투자자의 코스피 순매수/순매도 규모. 단기 시장 방향에 영향."
            higher_than_expected: "외국인 매수 → 코스피 상승 압력"
            lower_than_expected: "외국인 매도 → 코스피 하락 압력"
            related_sectors: ["코스피", "삼성전자", "SK하이닉스"]

  - id: china
    label: "중국"
    priority: 3
    purpose: "한국 수출주·제조업 경기·원자재·반도체 업황 판단"
    categories:
      - id: economy
        label: "경기"
        indicators:
          - id: cn_manufacturing_pmi
            label: "중국 제조업 PMI"
            full_name: "China NBS Manufacturing PMI"
            unit: "지수(50 기준)"
            release_cycle: "월간"
            description: "중국 제조업 경기 선행 지표. 한국 수출·원자재 수요에 직접 영향."
            higher_than_expected: "중국 제조업 회복 → 한국 수출 개선 기대 → 소재·산업재 긍정"
            lower_than_expected: "중국 수요 둔화 → 원자재 가격 하락 → 한국 수출주 부담"
            related_sectors: ["한국수출주", "원자재", "철강", "화학"]

          - id: cn_services_pmi
            label: "중국 서비스업 PMI"
            full_name: "China Caixin Services PMI"
            unit: "지수(50 기준)"
            release_cycle: "월간"
            description: "중국 내수·서비스 경기. 소비 회복과 내수 진작 여부 판단."
            higher_than_expected: "중국 내수 회복 → 소비재·관광 긍정"
            lower_than_expected: "내수 부진 → 중국 경기 우려"
            related_sectors: ["중국소비주", "화장품", "면세"]

      - id: inflation
        label: "물가"
        indicators:
          - id: cn_cpi
            label: "중국 CPI"
            full_name: "China Consumer Price Index"
            unit: "%YoY"
            release_cycle: "월간"
            description: "중국 소비자물가. 디플레이션 압력 여부 판단에 중요."
            higher_than_expected: "인플레이션 압력 → 인민은행 완화 여지 제한"
            lower_than_expected: "디플레이션 우려 → 인민은행 추가 부양 기대"
            related_sectors: ["원자재", "중국주식"]

          - id: cn_ppi
            label: "중국 PPI"
            full_name: "China Producer Price Index"
            unit: "%YoY"
            release_cycle: "월간"
